<!DOCTYPE html>
<html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ค้นหา ID Part</title>
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<style>
body{font-family:Arial,sans-serif;text-align:center;background:#f5f5f5;padding:20px}
h2{color:#333}input{width:90%;max-width:400px;padding:15px;font-size:20px;border-radius:8px;border:1px solid #ccc}
button{padding:15px 25px;font-size:18px;margin:10px;border:none;border-radius:8px;cursor:pointer}
#reader{width:320px;margin:20px auto}video{width:100%}#result{margin-top:20px;font-size:22px;font-weight:bold}
</style></head><body>
<h2>ค้นหา ID Part</h2>
<input id="part" type="text" placeholder="พิมพ์หรือสแกน ID Part"><br>
<button onclick="searchPart()">🔍 ค้นหา</button>
<button onclick="startScanner()">📷 สแกนบาร์โค้ด</button>
<div id="reader"><video id="video"></video></div><div id="result"></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbyuPCUtIjmZy0_2YQQGOktYIREvJ-1SU8oP8vvCSpPopzcaMI6K5xXnlo1yuxMDJOY8yw/exec";
let controls=null,scanning=false;
async function searchPart(){
 const part=partEl.value.trim(); if(!part){result.innerHTML="กรุณากรอก ID Part";return;}
 result.innerHTML="กำลังค้นหา...";
 try{let r=await fetch(API_URL+"?part="+encodeURIComponent(part));let j=await r.json();
 result.innerHTML=j.found?`✅ พบข้อมูล<br><br>ID Part : ${j.part}<br>จำนวน : ${j.qty}`:"❌ ไม่พบข้อมูล";
 }catch(e){result.innerHTML="❌ เชื่อมต่อไม่ได้<br>"+e;}
}
const partEl=document.getElementById("part"),result=document.getElementById("result");
async function startScanner(){
 if(scanning)return; scanning=true;
 const hints=new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128]);
 const reader=new ZXing.BrowserMultiFormatReader(hints);
 try{
  controls=await reader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}}},document.getElementById("video"),(res,err,ctrl)=>{
    if(res){partEl.value=res.getText(); ctrl.stop(); scanning=false; searchPart();}
  });
 }catch(e){scanning=false; alert("เปิดกล้องไม่ได้\n"+e);}
}
</script></body></html>
