<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ค้นหา ID Part</title>

<script src="https://unpkg.com/@zxing/browser@latest/umd/index.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
}

h2{
    color:#333;
}

input{
    width:90%;
    max-width:400px;
    padding:15px;
    font-size:20px;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    padding:15px 25px;
    font-size:18px;
    margin:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

#reader{
    width:320px;
    margin:20px auto;
}

#video{
    width:100%;
    border-radius:10px;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

</style>

</head>

<body>

<h2>ค้นหาหรือส่งคืน TERM / TERM ရှာဖွေခြင်း သို့မဟုတ် ပြန်အပ်ခြင်း</h2>

<input
id="part"
type="text"
placeholder="พิมพ์รหัส TERM/TERM ကုဒ်ရိုက်ထည့်ပါ">

<br>

<button id="searchButton" onclick="searchPart()">🔎 ค้นหา/...</button>

<br><br>

<button onclick="returnPartManual()"
style="background:#1976d2;color:white;padding:10px 20px;border:0;border-radius:8px;cursor:pointer;">
🔄 คืนของ-ส่งกลับ/ပစ္စည်းပြန်အပ်
</button>

<div id="result"></div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwFZadcGRJK1ATdCWg6oulRAbKjOyAzyoOip_e3TNlvi5EfhZrVsx5zpX42A-9q3xLK7A/exec";

let codeReader;
let scanning = false;

window.searchPart = async function searchPart() {

    const part = document.getElementById("part").value.trim();
    
    const searchButton = document.getElementById("searchButton");

searchButton.disabled = true;
searchButton.textContent = "🔄 กำลังค้นหา...";
document.getElementById("result").innerHTML = "⏳ กำลังค้นหา กรุณารอสักครู่...";

    if (!part) {
    document.getElementById("result").innerHTML = "กรุณากรอก รหัส TERM";
    searchButton.disabled = false;
    searchButton.textContent = "🔎 ค้นหา/...";
    return;
    }

    document.getElementById("result").innerHTML = "กำลังค้นหาแป๊บบบ...";

    try {

        const response = await fetch(API_URL + "?part=" + encodeURIComponent(part));

        const res = await response.json();

        console.log(res);

        if (res.found) {

    let html = "✅ พบ " + res.results.length + " รายการ<br><br>";

   res.results.forEach(function(item) {
    html +=
    "<div style='border:1px solid #ccc; padding:15px; margin:10px 0; border-radius:10px;'>" +
    "<b>รหัส / ကုဒ် :</b> " + item.part + "<br>" +
    "<b>คงเหลือ / လက်ကျန် :</b> " + item.qty + "<br>" +
    "<b>สถานะ / အခြေအနေ :</b> " + item.machine + "<br><br>" +

        "<button onclick=\"window.borrowPart('" +
item.part + "','" +
item.qty + "','" +
item.machine +
"')\" style='background:#28a745;color:white;padding:10px 20px;border:0;border-radius:8px;cursor:pointer;'>" +
"📦 เบิกไปใช้" +
"</button>" +

"</div>";


});

    document.getElementById("result").innerHTML = html;

} else {

    document.getElementById("result").innerHTML = "❌ ไม่พบข้อมูล";



        }

    } catch (err) {

  document.getElementById("result").innerHTML =
    "❌ เชื่อมต่อไม่ได้<br>" + err;

} finally {

  // คืนปุ่มหลังค้นหาเสร็จ
  searchButton.disabled = false;
  searchButton.textContent = "🔎 ค้นหา/...";
}

}
   
async function startScanner() {

    if (scanning) return;

    scanning = true;

    try {

        codeReader = new ZXing.BrowserMultiFormatReader();

        const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();

        if (!devices.length) {
            throw "ไม่พบกล้อง";
        }

        let cameraId = devices[0].deviceId;

        for (const device of devices) {

            const label = device.label.toLowerCase();

            if (
                label.includes("back") ||
                label.includes("rear") ||
                label.includes("environment")
            ) {
                cameraId = device.deviceId;
                break;
            }

        }

        await codeReader.decodeFromVideoDevice(

            cameraId,

            "video",

            (result, error) => {

                if (result) {

                    document.getElementById("part").value = result.getText();

                    codeReader.reset();

                    scanning = false;

                    searchPart();

                }

            }

        );

   
} catch (err) {

    scanning = false;

    alert("เปิดกล้องไม่ได้\n\n" + err);

}
    
}


// ตรงนี้วางโค้ดระบบเบิก
window.borrowPart = async function borrowPart(part, qty, machine) {

    const borrower = prompt("กรุณาใส่รหัสตัวเอง / မိမိဝန်ထမ်းကုဒ်ကို ထည့်ပါ");

    if (borrower === null || borrower.trim() === "") {
        return;
    }

    const note = prompt("เครื่อง / စက်နံပါတ်\nกรุณาใส่หมายเลขเครื่อง / စက်နံပါတ်ကို ထည့်ပါ");

    if (note === null) {
        return;
    }

    if (!confirm(
        "ยืนยันการเบิก\n\n" +
        "ID Part: " + part + "\n" +
        "จำนวน: " + qty + "\n" +
        "เครื่อง: " + machine + "\n" +
        "ผู้เบิก: " + borrower + "\n" +
        "หมายเหตุ: " + note
    )) {
        return;
    }

    try {

    const response = await fetch(API_URL, {
    method: "POST",
    headers: {
           "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
        action: "checkout",
        part: part,
        qty: qty,
        machine: machine,
        borrower: borrower,
        note: note
    })
});
        const result = await response.json();

        if (result.success) {
            alert("✅ เบิกสำเร็จ");
            searchPart();
        } else {
    alert("❌ Apps Script ตอบกลับ:\n\n" + JSON.stringify(result, null, 2));
        }

    } catch (error) {

        alert("❌ เชื่อมต่อ Apps Script ไม่ได้\n\n" + error);

    }


};
    window.returnPartManual = async function() {

    const part = prompt("🔄 คืนของ / ပြန်အပ်ပစ္စည်း\nกรุณาใส่รหัส TERM / TERM အမည်ထည့်ပါ");

    if (part === null || part.trim() === "") {
        return;
    }

    const qty = prompt("📦 จำนวนที่คืน / ပြန်အပ်မည့်အရေအတွက်\nกรุณาใส่จำนวนที่ต้องการคืน");

    if (qty === null || qty.trim() === "" || isNaN(qty) || Number(qty) <= 0) {
        alert("❌ กรุณาใส่จำนวนให้ถูกต้อง");
        return;
    }

    const machine = prompt("⚙️ เครื่อง / စက်နံပါတ်\nกรุณาระบุเครื่องที่นำไปใช้");

    if (machine === null || machine.trim() === "") {
        return;
    }

    await window.returnPart(
        part.trim(),
        Number(qty),
        machine.trim()
    );
};
window.returnPart = async function(part, qty, machine) {

    const borrower = prompt(
        "👤 ผู้คืน / ပစ္စည်းပြန်အပ်သူ\n" +
        "กรุณาใส่รหัสตัวเอง / မိမိအမည်ကိုထည့်ပါ"
    );

    if (borrower === null || borrower.trim() === "") {
        return;
    }

    if (!confirm(
        "ยืนยันการคืนของ / ပစ္စည်းပြန်အပ်မှုအတည်ပြုပါ\n\n" +
        "ID Part: " + part + "\n" +
        "จำนวนคืน: " + qty + "\n" +
        "เครื่อง: " + machine + "\n" +
        "ผู้คืน: " + borrower
    )) {
        return;
    }

    try {

        const response = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify({
                action: "return",
                part: part,
                qty: Number(qty),
                machine: machine,
                borrower: borrower
            })
        });

        const result = await response.json();

        if (result.success) {
            alert("✅ คืนของสำเร็จ / ပစ္စည်းပြန်အပ်ပြီးပါပြီ");
            searchPart();
        } else {
            alert(
                "❌ Apps Script ตอบกลับ:\n\n" +
                JSON.stringify(result, null, 2)
            );
        }

    } catch (error) {

        alert(
            "❌ เชื่อมต่อ Apps Script ไม่ได้\n\n" +
            error
        );
    }
};
    

</script>

</body>
</html>
